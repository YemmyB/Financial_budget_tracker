{% extends 'expenses/base.html' %}

{% block content %}
<div style="max-width: 500px; margin: 2rem auto;" class="form-section">
    <h2>Edit Transaction</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-primary">Update Transaction</button>
    </form>
    <p style="margin-top: 1rem; text-align: center;">
        <a href="{% url 'dashboard' %}">Cancel</a>
    </p>
</div>
{% endblock %}
